<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100px;font-family:var(--font-mono);font-size:11px;color:#fff">
<div style="flex:1;background:var(--ink-900);display:flex;align-items:flex-end;padding:6px">ink-900</div>
<div style="flex:1;background:var(--ink-700);display:flex;align-items:flex-end;padding:6px">ink-700</div>
<div style="flex:1;background:var(--ink-500);display:flex;align-items:flex-end;padding:6px">ink-500</div>
<div style="flex:1;background:var(--ink-300);display:flex;align-items:flex-end;padding:6px;color:var(--ink-900)">ink-300</div>
<div style="flex:1;background:var(--paper-100);display:flex;align-items:flex-end;padding:6px;color:var(--ink-900)">paper-100</div>
