<!-- @dsCard group="Layout" viewport="700x320" name="Grid & Breakpoints" subtitle="Material-style 4/8/12-column grid — margins and gutters scale with page width" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);color:var(--ink-900);font-size:13px">
<div style="display:grid;grid-template-columns:90px 70px 70px 1fr;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-500);padding-bottom:6px;border-bottom:1px solid var(--line)">
<span>Breakpoint</span><span>Columns</span><span>Margin</span><span>Gutter</span>
</div>
<div style="display:grid;grid-template-columns:90px 70px 70px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"><span>Compact</span><span>4</span><span>16px</span><span>16px</span></div>
<div style="display:grid;grid-template-columns:90px 70px 70px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"><span>Medium</span><span>8</span><span>32px</span><span>24px</span></div>
<div style="display:grid;grid-template-columns:90px 70px 70px 1fr;gap:8px;padding:8px 0 10px"><span>Expanded</span><span>12</span><span>40px</span><span>24px</span></div>
<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:6px">
<div style="grid-column:1/-1;height:18px;background:var(--chapter-1-100);border-radius:4px"></div>
</div>
</div>
