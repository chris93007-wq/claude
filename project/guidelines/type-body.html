<p style="margin:0 0 6px;font-weight:400">Both tools exist because direct questions fail — stated preferences cost the respondent nothing, so people ask for everything.</p>
<p style="margin:0 0 6px;font-weight:600">Forcing a real trade-off and observing the choice is what reveals true value.</p>
<p style="margin:0;font-weight:700;color:var(--ink-700)">Conjoint = Consider + Jointly</p>
