<!-- @dsCard group="Study Notes" viewport="1000x820" name="Formula Sheet" subtitle="Reference table — Concept / Decomposition / Formula, grouped under chapter-colored section bands" -->
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}</style>
<div id="root"></div>
<script type="text/babel">
const { PageBadge, PageFooter } = window.Notes_fd16d9;

function Tex({ tex }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (window.katex && ref.current) ref.current.innerHTML = window.katex.renderToString(tex, { throwOnError: false });
  }, [tex]);
  return <span ref={ref} style={{fontSize:14}}>{tex}</span>;
}

function FormulaSheetPage(){
  const page = { maxWidth: 940, margin: '0 auto', padding: '36px 32px', fontFamily: 'var(--font-body)', color: 'var(--ink-900)' };
  const h1 = { fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 30, margin: '0 0 18px' };
  const table = { width: '100%', borderCollapse: 'collapse' };
  const colHead = { textAlign: 'left', padding: '6px 14px', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 15, borderBottom: '2px solid var(--ink-900)' };
  const band = (ch) => ({ background: `var(--chapter-${ch}-100)`, color: `var(--chapter-${ch}-900)`, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 15 });
  const bandCell = { padding: '6px 14px' };
  const td1 = { padding: '10px 14px', fontSize: 14.5, fontWeight: 600, verticalAlign: 'top', width: '20%' };
  const td2 = { padding: '10px 14px', fontSize: 13.5, color: 'var(--ink-700)', lineHeight: 1.5, verticalAlign: 'top', width: '34%' };
  const td3 = { padding: '10px 14px', verticalAlign: 'top' };
  const rowBorder = { borderBottom: '1px solid var(--line)' };

  const sections = [
    { ch: 1, name: 'MaxDiff (Best-Worst Scaling)', rows: [
      { concept: 'Net Choice Score', decomp: 'Most% minus Least%, counted over every appearance of the item', tex: '\\text{Net} = \\text{Most\\%} - \\text{Least\\%}' },
      { concept: 'Most / Least %', decomp: 'Times picked, divided by total appearances', tex: '\\%\\text{Most} = \\dfrac{\\text{times picked Most}}{\\text{appearances}}' },
    ]},
    { ch: 2, name: 'TURF', rows: [
      { concept: 'Reach', decomp: 'Share of respondents covered by at least one bundle item', tex: '\\text{Reach} = \\dfrac{\\text{respondents covered}}{\\text{total respondents}}' },
      { concept: 'Incremental Reach', decomp: 'New reach added by one more item — overlap does not count twice', tex: '\\Delta\\text{Reach} = \\text{Reach}(A\\cup B) - \\text{Reach}(A)' },
    ]},
    { ch: 4, name: 'Conjoint Analysis', rows: [
      { concept: 'Utility', decomp: 'Sum of part-worths for every attribute level in one profile', tex: 'U = \\sum \\text{part-worths}' },
      { concept: 'Price Rate', decomp: 'Utility span over the price span it was measured across', tex: '\\text{rate} = \\dfrac{\\Delta \\text{utility}}{\\Delta \\text{price}}' },
      { concept: 'Willingness to Pay', decomp: "Attribute's utility, converted to dollars via the price rate", tex: '\\text{WTP} = \\dfrac{\\text{attribute utility}}{\\text{price rate}}' },
    ]},
  ];

  return (
    <div style={page}>
      <PageBadge week="Week 3" label="Formula Sheet" chapter={1} />
      <h1 style={h1}>Formula Sheet — Preference Measurement</h1>
      <table style={table}>
        <thead><tr>
          <th style={{...colHead,width:'20%'}}>Concept</th>
          <th style={{...colHead,width:'34%'}}>Decomposition</th>
          <th style={colHead}>Formula</th>
        </tr></thead>
        <tbody>
          {sections.map((s) => (
            <React.Fragment key={s.ch}>
              <tr style={band(s.ch)}><td style={bandCell} colSpan={3}>{s.name}</td></tr>
              {s.rows.map((r, i) => (
                <tr key={i} style={i === s.rows.length - 1 ? undefined : rowBorder}>
                  <td style={td1}>{r.concept}</td>
                  <td style={td2}>{r.decomp}</td>
                  <td style={td3}><Tex tex={r.tex} /></td>
                </tr>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
      <div style={{height:24}} />
      <PageFooter chapterLabel="Preference Measurement" page={9} totalPages={12} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<FormulaSheetPage />);
</script>
