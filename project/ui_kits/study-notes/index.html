<!-- @dsCard group="Study Notes" viewport="900x760" name="Topic Map" subtitle="Chapter overview — flashcard summary of every topic, then the intro section" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}</style>
<div id="root"></div>
<script type="text/babel">
const { Callout, KeyTermsTable, ComparisonTable, ChapterHeader, SectionTitle, TopicHeader, PageFooter, StepPipeline, FlashcardGrid } = window.Notes_fd16d9;

function TopicMapPage(){
  const page = { maxWidth: 1400, margin: '0 auto', padding: '0 32px 48px', fontFamily: 'var(--font-body)', color: 'var(--ink-900)' };
  const flow = { display: 'grid', gridTemplateColumns: '1fr 1fr', columnGap: 40, rowGap: 20, maxWidth: 1000, margin: '0 auto' };
  const full = { gridColumn: '1 / -1' };
  const p = { fontSize: 17, lineHeight: 1.65, margin: '0 0 20px' };
  const stack = { display: 'flex', flexDirection: 'column', gap: 20 };
  return (
    <div style={page}>
    <div style={flow}>
      <div style={full}><ChapterHeader chapterNumber={1} week="Week 3" chapter="Overview" title="Measuring & Quantifying Consumer Preferences" subtitle="Conjoint = Consider + Jointly" /></div>
      <div style={full}>
        <FlashcardGrid cards={[
          { title: 'MaxDiff', definition: 'Repeatedly pick the Most and Least important item from a small set.', formula: 'Net score = Most% − Least%, over every appearance.', why: 'Forces a real trade-off instead of a rating everyone inflates.', chapter: 1 },
          { title: 'TURF', definition: 'Finds the bundle that reaches the most people under a budget.', formula: 'Reach = share covered by at least one item in the bundle.', why: 'Only new reach counts — overlapping coverage adds nothing.', chapter: 2 },
          { title: 'The Pipeline', definition: 'Score and rank with MaxDiff, then run TURF for the optimal bundle.', why: 'Each tool answers a different question; chaining them answers both.', chapter: 3 },
          { title: 'Conjoint Analysis', definition: 'Turns trade-off choices into willingness-to-pay, in real dollars.', formula: 'WTP = attribute’s utility ÷ utils per dollar.', why: 'Price is the only attribute in real dollars, so dividing by it converts utils back to dollars.', chapter: 4 },
        ]} />
      </div>
      <div style={full}><div style={{margin:'8px 0 20px'}}><SectionTitle chapter={1}>Introduction</SectionTitle></div></div>
      <p style={p}>Both tools exist because direct questions fail — stated preferences ("what do you want?") and stated importance ratings ("rate this 1–9") both cost the respondent nothing, so people either ask for everything or rate everything as important. <mark style={{background:'var(--chapter-7-300)',color:'var(--ink-900)',padding:'1px 5px',borderRadius:8,fontWeight:700}}>Forcing a real trade-off and observing the choice is what reveals true value.</mark></p>
      <Callout chapter={1} label="KEY INSIGHT">Two tools, one agenda: MaxDiff answers "what matters most" (a ranking); Conjoint Analysis answers "how much does it matter, in dollars" (willingness-to-pay).</Callout>
      <Callout chapter={2} label="EXAM">Quiz 2 moved to Session 4, rescoped to CBC interpretation only — the MaxDiff/TURF/ratings-conjoint material below is still core course content.</Callout>

      <div style={full}><TopicHeader topicNumber={2} title="MaxDiff (Best-Worst Scaling)" kicker="Concept, design rules, the Pecan Street Bank scoring walkthrough, key terms" /></div>
      <div style={stack}>
        <p style={p}>Respondents see a small set of items (4–5 typical) and pick the ONE they like most and the ONE they like least — items in the middle stay unranked for that question; repetition across questions, with different item pairings, is what produces a full ranking.</p>
        <div><span style={{background:'var(--chapter-1-500)',color:'#fff',fontFamily:'var(--font-display)',fontWeight:600,fontSize:12,letterSpacing:'0.06em',padding:'4px 14px',borderRadius:999}}>BEST USE CASE</span></div>
        <p style={p}>8–30 features/benefits/ideas where you need to know which ones matter most, without rating-scale bias.</p>
      </div>
      <div style={stack}>
        <Callout chapter={1} label="COMMON MISTAKE">The denominator trap: if an item appeared 3 times and was picked Most twice, <strong style={{color:'var(--highlighter-trap-ink)'}}>the rate is 2 ÷ 3 = 66.7% — not 2 ÷ 2</strong>. "Neither selected" still counts as an appearance.</Callout>
        <Callout chapter={1} label="MEMORY AID">"Most minus Least, over every appearance" — never divide by selections only.</Callout>
      </div>
      <div style={full}><KeyTermsTable terms={[
        { term: 'MaxDiff / Best-Worst Scaling', explanation: 'Repeatedly pick the most- and least-important item from a small set', why: 'Forces a real trade-off, unlike a 1–9 importance rating', example: 'Choosing your favorite and least-favorite of 4 card perks, several times over' },
        { term: 'Net choice score', explanation: 'Most% − Least%, over every appearance', why: 'Ranks items by revealed preference, not stated importance', example: 'Groceries: 50.3% − 6.5% = +43.8pp' },
      ]} /></div>

      <div style={full}><TopicHeader topicNumber={3} title="TURF (Total Unduplicated Reach & Frequency)" kicker="Picking the bundle under a $60/year budget" /></div>
      <p style={p}>Continuing Topic 2's Pecan Street Bank case: MaxDiff scored and ranked all 12 perks by net choice score. Now TURF narrows that ranking to the 4-perk bundle that reaches the most people under a $60/year cost cap.</p>
      <Callout chapter={2} label="EXAM">Only new people count toward reach at each step — someone already reached by an earlier item doesn't add again when a later item also covers them.</Callout>
      <div style={full}><ComparisonTable chapter={2} columns={[{key:'bundle',label:'Bundle'},{key:'perks',label:'Four Perks'},{key:'cost',label:'Cost/Year'},{key:'reach',label:'Reach'}]} rows={[
        { bundle: 'A', perks: 'Groceries, gas/EV, intro APR, foreign fees', cost: '$70', reach: '87%' },
        { bundle: 'B', perks: 'Groceries, intro APR, foreign fees, fraud alerts', cost: '$59', reach: '80%' },
        { bundle: 'C', perks: 'Groceries, gas/EV, foreign fees, late-fee forgiveness', cost: '$54', reach: '70.5%' },
        { bundle: 'D', perks: 'Groceries, gas/EV, foreign fees, travel insurance', cost: '$60', reach: '69.5%' },
      ]} /></div>

      <div style={full}>
      <TopicHeader topicNumber={4} title="The MaxDiff → TURF Pipeline" kicker="A single pipeline, run in sequence" />
      <StepPipeline steps={[
        { label: 'Score & rank', body: 'Run a MaxDiff study to score and rank the full item list' },
        { label: 'Convert to binary', body: 'Convert MaxDiff scores into binary top-choice/threshold data' },
        { label: 'Optimal bundle', body: 'Run TURF on that binary data to find the mix with the widest reach' },
      ]} chapter={3} />
      </div>

      <div style={full}><PageFooter chapterLabel="Preference Measurement" page={3} totalPages={12} /></div>
    </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<TopicMapPage />);
</script>
