<!-- @dsCard group="Study Notes" viewport="900x900" name="Notes Page" subtitle="A real per-topic lecture-notes page — dense prose, worked diagrams, a 2-col aside" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}</style>
<div id="root"></div>
<script type="text/babel">
const { PageBadge, TopicHeader, SectionTitle, ConceptCard, WorkedExample, KeyTermsTable, Callout, PageFooter } = window.Notes_fd16d9;
function NotesPage(){
  const page = { maxWidth: 820, margin: '0 auto', padding: '40px 32px 0', fontFamily: 'var(--font-body)', color: 'var(--ink-900)' };
  const p = { fontSize: 16, lineHeight: 1.65, margin: '0 0 18px' };
  const twoCol = { display: 'grid', gridTemplateColumns: '1fr 1fr', columnGap: 32, rowGap: 18, margin: '18px 0' };
  return (
    <div style={page}>
      <PageBadge week="Week 3" label="Notes Page" chapter={1} />
      <TopicHeader topicNumber={5} title="Conjoint Analysis" kicker="Part-worths, utility, and willingness to pay" />
      <div style={{margin:'16px 0'}}><span style={{background:'var(--chapter-4-500)',color:'#fff',fontFamily:'var(--font-display)',fontWeight:600,fontSize:12,letterSpacing:'0.06em',padding:'4px 14px',borderRadius:999}}>RATINGS-BASED CONJOINT</span></div>
      <p style={p}>Conjoint analysis shows respondents full product profiles — several attributes bundled together, like a camera with a resolution, battery life, and price — and asks them to rate or choose between profiles. Because every attribute moves at once, the trade-offs respondents are forced to make reveal how much each attribute level is actually worth, rather than how important they say it is.</p>
      <div style={{margin:'20px 0'}}><SectionTitle chapter={4}>Part-Worths & Utility</SectionTitle></div>
      <p style={p}>Each attribute level (e.g. "50ft range" vs. "5ft range") gets its own part-worth — a number representing how much that level alone contributes to a respondent's overall liking. A profile's total utility is just the sum of the part-worths for its levels.</p>
      <div style={twoCol}>
        <ConceptCard
          chapter={4}
          term="Utility"
          definition="The overall attractiveness score for one specific product configuration."
          why="Because attributes combine additively, you can compare any two configurations just by adding up their parts — no need to re-survey every combination."
        />
        <ConceptCard
          chapter={4}
          term="Willingness to Pay"
          definition="The dollar amount a consumer's trade-offs imply they'd pay for one upgrade."
          why={<span>Price is the only attribute measured in <mark style={{background:'var(--chapter-7-300)',color:'var(--ink-900)',padding:'1px 5px',borderRadius:8,fontWeight:700}}>real dollars</mark>. Dividing the upgrade's utility by the price part-worth's slope converts utils back into dollars.</span>}
        />
      </div>
      <Callout chapter={4} label="MEMORY AID">Think of the price part-worth as an exchange rate — "utils per dollar" — and dividing by it is just converting currency.</Callout>
      <div style={{margin:'24px 0 16px'}}><SectionTitle chapter={4}>Worked Example</SectionTitle></div>
      <WorkedExample
        title="Converting Utility Into Willingness to Pay"
        setup="Four binary attributes — Accuracy (5ft vs. 50ft), Battery (12hr vs. 32hr), Display (LCD vs. OLED), Price ($199 vs. $249) — fit with OLS regression on 300 ranked profiles."
        context={<KeyTermsTable terms={[{term:'β (accuracy)', explanation: '11.85 utils', why: 'Utility gained moving from 5ft to 50ft range', example: ''}, {term:'β (price)', explanation: '−60.34 utils per $50', why: 'Utility lost moving from $199 to $249', example: ''}]} />}
        steps={[
          { label: 'Accuracy utility gained', lines: ['11.85 utils'] },
          { label: 'Convert the price slope to a rate', lines: ['60.34 utils over a $50 span', '60.34 ÷ 50 = 1.207 utils per $1 → $0.829 per util'] },
          { label: 'Apply the rate', lines: ['WTP = 11.85 utils × $0.829/util'] },
        ]}
        answer={{ value: '$9.83', label: 'Willingness to Pay' }}
        soWhat="A 50ft range upgrade is worth under $10 to the average respondent — not enough to justify a $30 price increase on its own."
        chapter={4}
      />
      <div style={{marginTop:28}}><PageFooter chapterLabel="Preference Measurement" page={4} totalPages={12} /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NotesPage />);
</script>
